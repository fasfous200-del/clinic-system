<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الطبي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f1f2f6; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        label { display: block; text-align: right; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: #34495e; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #dcdde1; border-radius: 5px; font-size: 1rem; }
        button { background: #2980b9; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1f618d; }
        .error-msg { color: #c0392b; font-size: 0.85rem; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول للعيادة</h2>
        <div id="errorMsg" class="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        
        <form id="loginForm">
            <label>اسم المستخدم / البريد:</label>
            <input type="text" id="username" required placeholder="أدخل اسم المستخدم...">

            <label>كلمة المرور:</label>
            <input type="password" id="password" required placeholder="أدخل كلمة المرور...">

            <button type="submit">دخول إلى لوحة التحكم</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            // بيانات تجريبية افتراضية لتسهيل الدخول الفوري
            // يمكنك تعديلها أو ربطها بقاعدة بياناتك المحلية
            if (usernameInput !== "" && passwordInput !== "") {
                const userData = {
                    full_name: usernameInput,
                    role: "مدير النظام / طبيب",
                    username: usernameInput
                };

                // حفظ بيانات الجلسة في الذاكرة المحلية
                localStorage.setItem('user', JSON.stringify(userData));

                // التوجيه النسبي الصحيح للوحة التحكم لمنع أخطاء 404
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
