<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - منصة العيادات الطبية</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.appspot.com",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const db = firebase.firestore();
    </script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2980b9; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2471a3; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول للنظام</h2>
        <form id="loginForm">
            <label>اختر العيادة / الفرع:</label>
            <select id="clinicSelect" required>
                <option value="">-- اختر العيادة --</option>
                <option value="clinic_01">عيادة نابلس (clinic_01)</option>
                <option value="clinic_02">عيادة رام الله (clinic_02)</option>
            </select>

            <label>اسم المستخدم:</label>
            <input type="text" id="username" required placeholder="أدخل اسم المستخدم...">

            <label>كلمة المرور:</label>
            <input type="password" id="loginPassword" required placeholder="أدخل كلمة المرور...">

            <button type="submit">دخول</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const selectedClinicId = document.getElementById('clinicSelect').value;
            const u = document.getElementById('username').value.trim().toLowerCase();
            const p = document.getElementById('loginPassword').value.trim();

            // بناء معرف المستند بالتركيبة الدقيقة (رمز العيادة + اسم المستخدم)
            const customDocId = `${selectedClinicId}_${u}`;

            try {
                // جلب المستند مباشرة باستخدام Document ID لسرعة فائقة ومنع التداخل
                const userDoc = await db.collection("sys_users").doc(customDocId).get();
                
                if (userDoc.exists) {
                    const userData = userDoc.data();

                    // التحقق من صحة كلمة المرور
                    if (userData.password === p) {
                        // حفظ بيانات الجلسة مع معرف العيادة الخاص به (Clinic ID)
                        localStorage.setItem('user', JSON.stringify(userData));
                        localStorage.setItem('current_clinic_id', userData.clinic_id);

                        alert(`مرحباً بك ${userData.full_name} (${userData.role})`);
                        window.location.href = 'dashboard.html';
                    } else {
                        alert('كلمة المرور غير صحيحة!');
                    }
                } else {
                    alert('اسم المستخدم غير موجود في هذه العيادة المحددة!');
                }
            } catch (err) {
                console.error("Login error:", err);
                alert('حدث خطأ أثناء تسجيل الدخول.');
            }
        });
    </script>
</body>
</html>
