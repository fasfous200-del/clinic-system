<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - النظام الطبي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #2c3e50; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 30px; border-radius: 8px; width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .login-card h2 { text-align: center; color: #16a085; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        select, input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #16a085; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #138d75; }
        .btn-secondary { background: #7f8c8d; margin-top: 5px; }
        .btn-secondary:hover { background: #6c7a89; }
        .error { color: #c0392b; text-align: center; font-size: 0.9rem; margin-bottom: 10px; }
        .hint { font-size: 0.8rem; color: #666; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>النظام الطبي الذكي</h2>
        <div id="errorMsg" class="error"></div>

        <!-- الخطوة الأولى: اختيار نوع الاستخدام (طبيب مستقل أم مركز طبي) -->
        <div id="step1" class="step active">
            <label>اختر صفة استخدام النظام:</label>
            <select id="userTypeChoice">
                <option value="doctor">طبيب مستقل (عيادة فردية)</option>
                <option value="center">مركز طبي متكامل</option>
            </select>
            <button type="button" onclick="goToStep2()">متابعة لتسجيل الدخول</button>
        </div>

        <!-- الخطوة الثانية: إدخال اسم المستخدم وكلمة المرور -->
        <div id="step2" class="step">
            <div id="selectedModeBadge" style="background: #eef2f5; padding: 8px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-weight: bold; color: #2980b9; font-size: 0.9rem;"></div>
            
            <form id="loginForm">
                <label>اسم المستخدم:</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم...">
                
                <label>كلمة المرور:</label>
                <input type="password" id="password" required placeholder="••••••">

                <button type="submit">دخول للنظام</button>
                <button type="button" class="btn-secondary" onclick="goToStep1()">رجوع للخلف</button>
            </form>
        </div>

        <div class="hint">
            <strong>الحسابات التجريبية:</strong><br>
            - طبيب: <code>doctor</code> / <code>123456</code><br>
            - مدير المركز/الاستقبال: <code>admin</code> أو <code>reception</code> / <code>123456</code>
        </div>
    </div>

    <script>
        let chosenType = 'doctor';

        function goToStep2() {
            chosenType = document.getElementById('userTypeChoice').value;
            const badge = document.getElementById('selectedModeBadge');
            
            if (chosenType === 'doctor') {
                badge.textContent = 'الوضع الحالي: عيادة طبيب مستقل (عيادة فردية)';
                // اقتراح اسم مستخدم الطبيب لتسهيل التجربة
                document.getElementById('username').value = 'doctor';
            } else {
                badge.textContent = 'الوضع الحالي: مركز طبي متكامل';
                document.getElementById('username').value = 'admin';
            }

            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('errorMsg').textContent = '';
        }

        function goToStep1() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('errorMsg').textContent = '';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // حفظ معلومات المستخدم ونوع المنشأة المختارة في المتصفح
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('facility_mode', chosenType);

                    // التوجيه الذكي حسب الاختيار ودور المستخدم
                    if (chosenType === 'doctor' || data.user.role === 'doctor') {
                        window.location.href = '/doctor.html';
                    } else if (data.user.role === 'pharmacist') {
                        window.location.href = '/pharmacy.html';
                    } else if (data.user.role === 'billing') {
                        window.location.href = '/billing.html';
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    document.getElementById('errorMsg').textContent = data.error;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('errorMsg').textContent = 'حدث خطأ في الاتصال بالخادم';
            }
        });
    </script>
</body>
</html>
