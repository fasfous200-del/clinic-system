<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - Clinical Cloud</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.appspot.com",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const db = firebase.firestore();
    </script>
    <script src="sys-core.js"></script>
    <style>
        :root {
            --primary-color: #0EA5E9;
            --secondary-color: #10B981;
            --dark-color: #0F172A;
            --bg-color: #F8FAFC;
        }
        body {
            font-family: Tahoma, sans-serif;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            border-top: 4px solid var(--primary-color);
        }
        h2 {
            text-align: center;
            color: var(--dark-color);
            margin-bottom: 25px;
            font-size: 24px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #CBD5E1;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        button {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">Clinical Cloud</div>
        <h2>تسجيل الدخول للنظام</h2>
        <form id="loginForm">
            <label for="username">اسم المستخدم:</label>
            <input type="text" id="username" required placeholder="أدخل اسم المستخدم الفريد...">

            <label for="loginPassword">كلمة المرور:</label>
            <input type="password" id="loginPassword" required placeholder="أدخل كلمة المرور...">

            <button type="submit">دخول</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const u = document.getElementById('username').value.trim().toLowerCase();
            const p = document.getElementById('loginPassword').value.trim();

            try {
                // 1. التحقق من وجود المستخدم عبر اسم المستخدم في مجموعة sys_users
                const snapshot = await db.collection("sys_users")
                    .where("username", "==", u)
                    .get();
                
                if (!snapshot.empty) {
                    const userDoc = snapshot.docs[0];
                    const userData = userDoc.data();

                    // 2. التحقق من صحة كلمة المرور
                    if (userData.password !== p) {
                        alert('كلمة المرور غير صحيحة!');
                        return;
                    }

                    // 3. استثناء حساب السوبر أدمن (abumousa2027)
                    if (userData.username === 'abumousa2027') {
                        localStorage.setItem('user', JSON.stringify(userData));
                        alert('مرحباً بك يا أبو موسى (Super Admin)');
                        window.location.href = 'super_admin.html';
                        return;
                    }

                    // 4. التحقق من حالة الإيقاف اليدوي
                    if (userData.subscription_status === 'blocked') {
                        alert('❌ عذراً، هذا الحساب موقوف من قبل الإدارة.');
                        return;
                    }

                    // 5. فحص تاريخ انتهاء الصلاحية للمستخدمين العاديين وأصحاب العيادات
                    if (userData.expiry_date) {
                        const todayDateOnly = new Date();
                        todayDateOnly.setHours(0, 0, 0, 0);

                        const expDateObj = new Date(userData.expiry_date);
                        expDateObj.setHours(0, 0, 0, 0);

                        if (todayDateOnly > expDateObj) {
                            alert('❌ عذراً، انتهت صلاحية اشتراك العيادة. يرجى التواصل مع الإدارة للتجديد.');
                            return;
                        }
                    }

                    // 6. التحقق من الصلاحية والتوجيه المباشر للـ owner
                    const clinicId = userData.clinic_id || "main_settings";
                    localStorage.setItem('user', JSON.stringify(userData));
                    localStorage.setItem('current_clinic_id', clinicId);

                    // تحديث وقت آخر دخول للمستفيد
                    await db.collection("sys_users").doc(userDoc.id).set({
                        last_login: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    // إذا كان الحساب مالك عيادة (owner)، نمنحه صلاحيات مطلقة
                    if (userData.role === 'owner') {
                        localStorage.setItem('is_full_owner', 'true');
                        alert(`مرحباً بك يا صاحب العيادة ${userData.facility_name || userData.username}`);
                        window.location.href = 'dashboard.html';
                        return;
                    }

                    // للمستخدمين العاديين
                    alert(`مرحباً بك ${userData.full_name || userData.username} (${userData.role})`);
                    window.location.href = 'dashboard.html';

                } else {
                    alert('اسم المستخدم غير موجود في النظام!');
                }
            } catch (err) {
                console.error("Login error:", err);
                alert('حدث خطأ أثناء تسجيل الدخول.');
            }
        });
    </script>
</body>
</html>
