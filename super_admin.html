<html lang="ar" dir="rtl">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.appspot.com",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const db = firebase.firestore();

      // 🔒 فحص الحماية: التأكد أن المستخدم الحالي هو المالك (abumousa2027)
      const currentUserStr = localStorage.getItem('user');
      const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;

      const SUPER_ADMIN_USERNAME = 'abumousa2027'; 

      if (!currentUser || currentUser.username !== SUPER_ADMIN_USERNAME) {
          alert('عذراً، هذه الصفحة مخصصة لمالك النظام (Super Admin) فقط!');
          window.location.href = 'login.html'; // إعادة التوجيه الفوري لصفحة تسجيل الدخول

    </script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f5; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95rem; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: right; }
        th { background: #34495e; color: white; }
        .btn-back { display: inline-block; margin-bottom: 15px; background: #16a085; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="btn-back">🏠 العودة للرئيسية</a>
        <h2>👑 لوحة تحكم المالك: متابعة اشتراكات العيادات</h2>
        <p style="color: #666; font-size: 0.9rem;">تعرض هذه الصفحة حالة جميع العيادات المشتركة، تواريخ الانتهاء، والأيام المتبقية تلقائياً.</p>
        
        <table>
            <thead>
                <tr>
                    <th>اسم العيادة / المعرف</th>
                    <th>حالة الاشتراك</th>
                    <th>تاريخ البداية</th>
                    <th>تاريخ الانتهاء</th>
                    <th>الأيام المتبقية</th>
                </tr>
            </thead>
            <tbody id="adminClinicsTable">
                <tr><td colspan="5" style="text-align:center;">جاري جلب بيانات العيادات من فايرستور...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadAdminClinicsData() {
            try {
                const snapshot = await db.collection("sys_settings").get();
                const tbody = document.getElementById('adminClinicsTable');
                tbody.innerHTML = snapshot.empty ? '<tr><td colspan="5" style="text-align:center;">لا توجد عيادات مسجلة.</td></tr>' : '';

                const today = new Date();

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const facilityName = data.facility_name || doc.id;
                    const status = data.subscription_status || 'غير محدد';
                    const startDateStr = data.start_date;
                    const expiryDateStr = data.expiry_date;

                    let remainingText = 'غير محدد';
                    let colorStyle = 'black';

                    if (expiryDateStr) {
                        const expiryDate = new Date(expiryDateStr);
                        const timeDiff = expiryDate.getTime() - today.getTime();
                        const days = Math.ceil(timeDiff / (1000 * 3600 * 24));

                        if (days < 0) {
                            remainingText = `منتهي منذ ${Math.abs(days)} يوم ❌`;
                            colorStyle = '#c0392b';
                        } else {
                            remainingText = `متبقي ${days} يوم ✔`;
                            colorStyle = '#27ae60';
                        }
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${facilityName}</strong> (${doc.id})</td>
                            <td>${status}</td>
                            <td>${startDateStr ? new Date(startDateStr).toLocaleDateString('ar-EG') : 'غير متوفر'}</td>
                            <td>${expiryDateStr ? new Date(expiryDateStr).toLocaleDateString('ar-EG') : 'غير متوفر'}</td>
                            <td><span style="color:${colorStyle}; font-weight:bold;">${remainingText}</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error loading admin data:", err);
                alert("حدث خطأ أثناء جلب البيانات.");
            }
        }

        loadAdminClinicsData();
    </script>
</body>
</html>
