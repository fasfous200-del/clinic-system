<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المرضى والمواعيد - المركز الطبي</title>
    <!-- مكتبات Firebase Compat -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.firebasestorage.app",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.firestore();
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f5; margin: 0; padding: 20px; direction: rtl; }
        .close-btn { position: fixed; top: 15px; right: 15px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 999; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .close-btn:hover { background: #c0392b; }
        .header { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #16a085; border-bottom: 2px solid #eef2f5; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background: #16a085; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; }
        .btn-submit:hover { background: #117a65; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 0.85rem; }
        th { background-color: #f8f9fa; color: #333; }
    </style>
</head>
<body>

    <!-- زر الإغلاق ❌ -->
    <button class="close-btn" onclick="closeAndReturnToDashboard()" title="رجوع للوحة التحكم">❌</button>

    <h1 class="header">المركز الطبي العائلي - إدارة المرضى والمواعيد</h1>

    <div class="grid-container">
        <!-- قسم تسجيل مريض جديد -->
        <div>
            <div class="card">
                <h3>تسجيل مريض جديد (فتح ملف طبي)</h3>
                <form id="patientForm" onsubmit="savePatient(event)">
                    <div class="form-group">
                        <label>اسم المريض (رباعي):</label>
                        <input type="text" id="patientName" required placeholder="الاسم رباعياً...">
                    </div>
                    <div class="form-group">
                        <label>رقم الهوية / الرقم الوطني:</label>
                        <input type="text" id="patientIdNum" placeholder="رقم الهوية...">
                    </div>
                    <div class="form-group">
                        <label>الجنس:</label>
                        <select id="patientGender">
                            <option value="ذكر">ذكر</option>
                            <option value="أنثى">أنثى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>العمر:</label>
                        <input type="number" id="patientAge" placeholder="العمر بالأعوام">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف الأساسي:</label>
                        <input type="tel" id="patientPhone" required placeholder="رقم الهاتف...">
                    </div>
                    <button type="submit" class="btn-submit" id="savePatientBtn">حفظ وفتح الملف الطبي</button>
                </form>
            </div>

            <!-- قسم حجز موعد جديد -->
            <div class="card">
                <h3>📅 حجز موعد طبي جديد</h3>
                <form id="appointmentForm" onsubmit="saveAppointment(event)">
                    <div class="form-group">
                        <label>اختر المريض:</label>
                        <select id="appointmentPatientSelect" required>
                            <option value="">-- اختر المريض من القائمة --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الطبيب المعالج:</label>
                        <input type="text" id="doctorName" placeholder="اسم الطبيب (اختياري)...">
                    </div>
                    <div class="form-group">
                        <label>تاريخ الموعد:</label>
                        <input type="date" id="appointmentDate" required>
                    </div>
                    <div class="form-group">
                        <label>توقيت الموعد:</label>
                        <input type="time" id="appointmentTime" required>
                    </div>
                    <button type="submit" class="btn-submit" style="background: #2980b9;" id="saveApptBtn">تأكيد وحجز الموعد</button>
                </form>
            </div>
        </div>

        <!-- قسم القوائم ودليل المرضى -->
        <div>
            <div class="card">
                <h3>📋 قائمة مواعيد اليوم (المُنتظرون)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>اسم المريض</th>
                            <th>الوقت</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="todayAppointmentsList">
                        <tr><td colspan="4">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h3>🔍 دليل المرضى (الملفات المسجلة)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>رقم الملف</th>
                            <th>اسم المريض</th>
                            <th>الهاتف</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="patientsDirectoryList">
                        <tr><td colspan="4">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // التحقق من العيادة الحالية المسجلة في المتصفح
        const currentClinicId = localStorage.getItem('current_clinic_id') || "default_clinic";

        function closeAndReturnToDashboard() {
            window.location.href = 'dashboard.html';
        }

        // 1. حفظ مريض جديد في مجموعة sys_patients مع ربطه بـ clinic_id
        async function savePatient(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('savePatientBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'جاري الحفظ...';

            const patientData = {
                name: document.getElementById('patientName').value.trim(),
                idNumber: document.getElementById('patientIdNum').value.trim(),
                gender: document.getElementById('patientGender').value,
                age: document.getElementById('patientAge').value,
                phone: document.getElementById('patientPhone').value.trim(),
                clinic_id: currentClinicId,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("sys_patients").add(patientData);
                alert("تم حفظ بيانات المريض بنجاح!");
                document.getElementById('patientForm').reset();
            } catch (error) {
                console.error("خطأ الحفظ:", error);
                alert("حدث خطأ أثناء الحفظ: " + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'حفظ وفتح الملف الطبي';
            }
        }

        // 2. حجز موعد جديد في مجموعة sys_appointments مع ربطه بـ clinic_id
        async function saveAppointment(e) {
            e.preventDefault();
            const apptBtn = document.getElementById('saveApptBtn');
            apptBtn.disabled = true;
            apptBtn.textContent = 'جاري الحجز...';

            const selectEl = document.getElementById('appointmentPatientSelect');
            const selectedOption = selectEl.options[selectEl.selectedIndex];

            const apptData = {
                patientId: selectEl.value,
                patientName: selectedOption.text,
                doctorName: document.getElementById('doctorName').value.trim(),
                date: document.getElementById('appointmentDate').value,
                time: document.getElementById('appointmentTime').value,
                clinic_id: currentClinicId,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("sys_appointments").add(apptData);
                alert("تم حجز الموعد بنجاح!");
                document.getElementById('appointmentForm').reset();
            } catch (error) {
                console.error("خطأ حجز الموعد:", error);
                alert("حدث خطأ أثناء الحجز: " + error.message);
            } finally {
                apptBtn.disabled = false;
                apptBtn.textContent = 'تأكيد وحجز الموعد';
            }
        }

        // 3. جلب وعرض قائمة المرضى (sys_patients) المفلترة حسب العيادة
        function loadPatients() {
            db.collection("sys_patients")
              .where("clinic_id", "==", currentClinicId)
              .onSnapshot((snapshot) => {
                const list = document.getElementById('patientsDirectoryList');
                const selectEl = document.getElementById('appointmentPatientSelect');
                
                if (snapshot.empty) {
                    list.innerHTML = '<tr><td colspan="4">لا يوجد مرضى مسجلون لهذه العيادة</td></tr>';
                    selectEl.innerHTML = '<option value="">-- لا توجد ملفات متاحة --</option>';
                    return;
                }

                let html = '';
                let selectHtml = '<option value="">-- اختر المريض من القائمة --</option>';

                snapshot.forEach((doc) => {
                    const p = doc.data();
                    const docId = doc.id;
                    
                    html += `
                        <tr>
                            <td>${docId.substring(0, 6)}</td>
                            <td>${p.name || 'بدون اسم'}</td>
                            <td>${p.phone || '-'}</td>
                            <td><button onclick="alert('ملف المريض: ${p.name}')">عرض</button></td>
                        </tr>
                    `;

                    selectHtml += `<option value="${docId}">${p.name} (${p.phone || 'بدون هاتف'})</option>`;
                });

                list.innerHTML = html;
                selectEl.innerHTML = selectHtml;
            }, (error) => {
                console.error("خطأ جلب المرضى:", error);
                document.getElementById('patientsDirectoryList').innerHTML = '<tr><td colspan="4" style="color:red;">خطأ في الصلاحيات أو الفهارس (Indexes)</td></tr>';
            });
        }

        // 4. جلب وعرض مواعيد اليوم (sys_appointments) المفلترة حسب العيادة
        function loadAppointments() {
            db.collection("sys_appointments")
              .where("clinic_id", "==", currentClinicId)
              .onSnapshot((snapshot) => {
                const list = document.getElementById('todayAppointmentsList');
                if (snapshot.empty) {
                    list.innerHTML = '<tr><td colspan="4">لا توجد مواعيد مسجلة اليوم</td></tr>';
                    return;
                }

                let html = '';
                let i = 1;
                snapshot.forEach((doc) => {
                    const a = doc.data();
                    html += `
                        <tr>
                            <td>${i++}</td>
                            <td>${a.patientName || 'مريض'}</td>
                            <td>${a.time || '-'} (${a.date || ''})</td>
                            <td><button style="background:#2980b9; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="alert('دخول المريض للطبيب: ${a.patientName}')">دخول للطبيب</button></td>
                        </tr>
                    `;
                });
                list.innerHTML = html;
            }, (error) => {
                console.error("خطأ جلب المواعيد:", error);
                document.getElementById('todayAppointmentsList').innerHTML = '<tr><td colspan="4" style="color:red;">خطأ في جلب المواعيد</td></tr>';
            });
        }

        // تشغيل الدوال عند تحميل الصفحة
        window.onload = function() {
            loadPatients();
            loadAppointments();
        };
    </script>
</body>
</html>
