<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المرضى والمواعيد</title>
    <!-- استخدام مكتبات Firebase عبر CDN بديل وسريع (cdnjs) لتجنب أي حجب -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.firebasestorage.app",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.firestore();
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #eef2f5; margin: 0; padding: 20px; direction: rtl; }
        .close-btn { position: fixed; top: 15px; right: 15px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 999; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .close-btn:hover { background: #c0392b; }
        .header { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #16a085; border-bottom: 2px solid #eef2f5; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { background: #16a085; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; }
        .btn-submit:hover { background: #117a65; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 0.85rem; }
        th { background-color: #f8f9fa; color: #333; }
    </style>
</head>
<body>

    <!-- زر الإغلاق ❌ -->
    <button class="close-btn" onclick="closeAndReturnToDashboard()" title="رجوع للوحة التحكم">❌</button>

    <h1 class="header">المركز الطبي العائلي - إدارة المرضى والمواعيد</h1>

    <div class="grid-container">
        <!-- قسم تسجيل مريض جديد -->
        <div>
            <div class="card">
                <h3>تسجيل مريض جديد (فتح ملف طبي)</h3>
                <form id="patientForm" onsubmit="savePatient(event)">
                    <div class="form-group">
                        <label>اسم المريض (رباعي):</label>
                        <input type="text" id="patientName" required placeholder="الاسم رباعياً...">
                    </div>
                    <div class="form-group">
                        <label>رقم الهوية / الرقم الوطني:</label>
                        <input type="text" id="patientIdNum" placeholder="رقم الهوية...">
                    </div>
                    <div class="form-group">
                        <label>الجنس:</label>
                        <select id="patientGender">
                            <option value="ذكر">ذكر</option>
                            <option value="أنثى">أنثى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>العمر:</label>
                        <input type="number" id="patientAge" placeholder="العمر بالأعوام">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف الأساسي:</label>
                        <input type="tel" id="patientPhone" required placeholder="رقم الهاتف...">
                    </div>
                    <button type="submit" class="btn-submit" id="savePatientBtn">حفظ وفتح الملف الطبي</button>
                </form>
            </div>
        </div>

        <!-- قسم القوائم -->
        <div>
            <div class="card">
                <h3>📅 قائمة مواعيد اليوم (المُنتظرون)</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>اسم المريض</th>
                            <th>الوقت</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="todayAppointmentsList">
                        <tr><td colspan="4">لا توجد مواعيد اليوم</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h3>🔍 دليل المرضى والبحث عن ملف</h3>
                <div class="form-group">
                    <input type="text" id="searchPatientInput" placeholder="ابحث باسم المريض أو رقم الهاتف...">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>رقم الملف</th>
                            <th>اسم المريض</th>
                            <th>الهاتف</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="patientsDirectoryList">
                        <tr><td colspan="4">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // دالة العودة للوحة التحكم (الاسم الصحيح للملف لديك هو dashboard (2).html أو dashboard.html)
        function closeAndReturnToDashboard() {
            // جرب الانتقال للوحة التحكم المتاحة لديك
            window.location.href = 'dashboard.html';
        }

        // حفظ المريض في فايرستور
        async function savePatient(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('savePatientBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'جاري الحفظ...';

            const patientData = {
                name: document.getElementById('patientName').value.trim(),
                idNumber: document.getElementById('patientIdNum').value.trim(),
                gender: document.getElementById('patientGender').value,
                age: document.getElementById('patientAge').value,
                phone: document.getElementById('patientPhone').value.trim(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection("patients").add(patientData);
                alert("تم حفظ بيانات المريض وفتح الملف بنجاح!");
                document.getElementById('patientForm').reset();
            } catch (error) {
                console.error("خطأ أثناء الحفظ:", error);
                alert("تعذر الحفظ (تحقق من قواعد الأمان في فايربيس أو الاتصال): " + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'حفظ وفتح الملف الطبي';
            }
        }

        // جلب المرضى مع معالجة الأخطاء تماماً
        function loadPatients() {
            db.collection("patients").orderBy("createdAt", "desc").limit(20)
                .onSnapshot((snapshot) => {
                    const list = document.getElementById('patientsDirectoryList');
                    if (snapshot.empty) {
                        list.innerHTML = '<tr><td colspan="4">لا يوجد مرضى مسجلون حالياً</td></tr>';
                        return;
                    }

                    let html = '';
                    snapshot.forEach((doc) => {
                        const p = doc.data();
                        html += `
                            <tr>
                                <td>${doc.id.substring(0, 6)}</td>
                                <td>${p.name || 'بدون اسم'}</td>
                                <td>${p.phone || '-'}</td>
                                <td><button onclick="alert('ملف المريض: ${p.name}')">عرض</button></td>
                            </tr>
                        `;
                    });
                    list.innerHTML = html;
                }, (error) => {
                    console.error("خطأ جلب البيانات:", error);
                    document.getElementById('patientsDirectoryList').innerHTML = '<tr><td colspan="4" style="color:red;">خطأ صلاحيات (Rules) أو انقطاع اتصال</td></tr>';
                });
        }

        window.onload = function() {
            loadPatients();
        };
    </script>
</body>
</html>
