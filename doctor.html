<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>عيادة الطبيب - النظام الطبي</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.firebasestorage.app",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const db = firebase.firestore();

      const currentUserStr = localStorage.getItem('user');
      const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
      if (!currentUser) {
          alert('يرجى تسجيل الدخول أولاً!');
          window.location.href = 'login.html';
      }
    </script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f5; margin: 0; padding: 15px; color: #333; }
        header { background: #2980b9; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        nav { text-align: center; margin-bottom: 20px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        nav a { color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-weight: bold; margin: 0 4px; display: inline-block; font-size: 0.9rem; }
        .btn-home { background: #16a085; }
        .btn-billing { background: #e67e22; }
        .btn-doctor { background: #2980b9; }
        .btn-settings { background: #34495e; }

        .main-layout { display: flex; gap: 20px; max-width: 1300px; margin: 0 auto; }
        @media(max-width: 768px) { .main-layout { flex-direction: column; } }

        .sidebar { width: 350px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); height: fit-content; }
        .sidebar h3 { font-size: 1rem; color: #2980b9; border-bottom: 2px solid #ecf0f1; padding-bottom: 6px; margin-top: 0; }

        .patient-card-item { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; cursor: pointer; background: #f8fafc; transition: 0.2s; }
        .patient-card-item:hover { background: #edf2f7; border-color: #2980b9; }
        .patient-card-item.active { background: #ebf8ff; border-color: #3182ce; }

        .content-area { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .content-area h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; }

        label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: Tahoma; }
        textarea { resize: vertical; height: 100px; }
        
        button.btn-save { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        button.btn-save:hover { background: #219653; }

        .badge-unpaid { background: #fed7d7; color: #c53030; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .badge-paid { background: #c6f6d5; color: #22543d; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }

        .module-box { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 6px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>🩺 عيادة الطبيب والكشف السريري</h1>
        <p id="userInfo" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
    </header>

    <nav id="dynamicNav">
        <a href="dashboard.html" class="btn-home">🏠 الرئيسية</a>
        <a href="billing.html" class="btn-billing">💰 الفواتير</a>
        <a href="doctor.html" class="btn-doctor">🩺 الطبيب</a>
        <a href="settings.html" class="btn-settings">⚙️ الإعدادات</a>
    </nav>

    <div class="main-layout">
        <!-- قائمة الانتظار الجانبية الحقيقية للمرضى -->
        <div class="sidebar">
            <h3>⏳ قائمة الانتظار والدور</h3>
            <div id="waitingPatientsList" style="max-height: 480px; overflow-y: auto;">
                <div style="font-size:0.85rem; color:#7f8c8d; text-align:center; padding:15px;">جاري تحميل قائمة المنتظرين...</div>
            </div>
        </div>

        <!-- منطقة الكشف الطبي والروشتة -->
        <div class="content-area">
            <h3>📝 شاشة الكشف الطبي والروشتة</h3>
            <div id="noPatientSelected" style="text-align:center; color:#7f8c8d; padding:50px;">
                الرجاء اختيار مريض من قائمة الانتظار الجانبية للبدء بالكشف.
            </div>

            <form id="consultationForm" style="display:none;">
                <div style="background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <strong>المريض: </strong><span id="selectedPatientName" style="color:#2980b9; font-size:1.1rem;">-</span><br>
                        <small style="color:#666;" id="selectedPatientPhone">-</small>
                    </div>
                    <div>
                        <strong>الحالة المالية عند المحاسب: </strong> <span id="selectedPaymentBadge">-</span>
                    </div>
                </div>

                <label>تشخيص الطبيب والملاحظات السريرية:</label>
                <textarea id="doctorDiagnosis" placeholder="اكتب التشخيص هنا..."></textarea>

                <label>الروشتة الطبية العامة:</label>
                <textarea id="doctorPrescription" placeholder="اكتب الروشتة والأدوية هنا..."></textarea>

                <!-- قسم الصيدلية (أدوية المخزون الحقيقي فقط) -->
                <div class="module-box" id="pharmacyModuleBox">
                    <label style="color:#2980b9;">💊 اختيار دواء من المخزون الحقيقي:</label>
                    <select id="pharmacyItemSelect">
                        <option value="">-- اختر الدواء --</option>
                    </select>
                    <button type="button" onclick="addMedicineToPrescription()" style="background:#2980b9; color:white; border:none; padding:6px 10px; border-radius:4px; margin-top:5px; cursor:pointer; font-weight:bold;">إضافة الدواء للروشتة</button>
                </div>

                <!-- قسم المختبر (فحوصات حقيقية مسجلة) -->
                <div class="module-box" id="labModuleBox">
                    <label style="color:#8e44ad;">🧪 طلب فحص مخبري مسجل:</label>
                    <select id="labTestSelect" onchange="addLabTestToPrescription()">
                        <option value="">-- اختر فحص مختبر --</option>
                    </select>
                </div>

                <!-- قسم الأشعة (أشعة حقيقية مسجلة) -->
                <div class="module-box" id="radModuleBox">
                    <label style="color:#d35400;">🩻 طلب صورة أشعة مسجلة:</label>
                    <select id="radTestSelect" onchange="addRadTestToPrescription()">
                        <option value="">-- اختر فحص أشعة --</option>
                    </select>
                </div>

                <button type="submit" class="btn-save">حفظ الكشف الطبي وإرسال الروشتة ✔</button>
            </form>
        </div>
    </div>

    <script>
        let selectedPatient = null;

        async function initDoctorPage() {
            if (currentUser) {
                document.getElementById('userInfo').textContent = `الطبيب: ${currentUser.full_name || currentUser.username}`;
            }

            // فحص صلاحيات الأقسام المفعلة للعيادة في السحاب وجلب البيانات الحقيقية حصرياً
            try {
                const userDoc = await db.collection("sys_users").doc(currentUser.username).get();
                if (userDoc.exists) {
                    const mods = userDoc.data().modules || {};
                    if (mods.pharmacy && mods.pharmacy.active) {
                        document.getElementById('pharmacyModuleBox').style.display = 'block';
                        loadRealInventoryMedicines();
                    }
                    if (mods.lab && mods.lab.active) {
                        document.getElementById('labModuleBox').style.display = 'block';
                        loadRealLabTests();
                    }
                    if (mods.radiology && mods.radiology.active) {
                        document.getElementById('radModuleBox').style.display = 'block';
                        loadRealRadTests();
                    }
                }
            } catch(e) { console.error(e); }

            loadWaitingQueue();
        }

        // جلب المرضى الحقيقيين من قائمة الانتظار وتحديث حالة الدفع بناءً على جدول الفواتير
        function loadWaitingQueue() {
            // الاستماع المباشر لجدول المواعيد وجدول الفواتير لمعرفة حالة الدفع بدقة
            db.collection("appointments").onSnapshot(appointmentSnapshot => {
                db.collection("sys_billing").onSnapshot(billingSnapshot => {
                    
                    // خريطة لتخزين حالة الدفع لكل مريض من الفواتير
                    let billingStatusMap = {};
                    billingSnapshot.forEach(doc => {
                        const b = doc.data();
                        if (b.patient_id) {
                            const total = parseFloat(b.total_amount || b.amount || 0);
                            const paid = parseFloat(b.paid_amount || 0);
                            // يعتبر مدفوعاً إذا تم السداد بالكامل أو كانت الحالة paid
                            if (b.status === 'paid' || (total > 0 && paid >= total)) {
                                billingStatusMap[String(b.patient_id)] = true;
                            }
                        }
                    });

                    const waitingContainer = document.getElementById('waitingPatientsList');
                    waitingContainer.innerHTML = '';

                    if (appointmentSnapshot.empty) {
                        waitingContainer.innerHTML = '<div style="font-size:0.85rem; color:#7f8c8d; text-align:center; padding:15px;">لا توجد مواعيد مسجلة</div>';
                        return;
                    }

                    let count = 0;
                    appointmentSnapshot.forEach(doc => {
                        const p = { id: doc.id, ...doc.data() };
                        
                        // نعرض فقط المرضى الموجودين في قائمة الانتظار ولم يتم الكشف عليهم بعد
                        if (p.status !== 'تم الكشف') {
                            count++;
                            const name = p.patient_name || p.name || 'مريض بدون اسم';
                            const pId = String(p.id || p.patient_id || '');
                            
                            // التحقق هل تم الدفع عبر جدول الفواتير أو الحقل المحلي
                            const isPaid = billingStatusMap[pId] || p.payment_status === 'paid';
                            const paymentBadge = isPaid ? '<span class="badge-paid">مدفوع ✔</span>' : '<span class="badge-unpaid">غير دافع ❌</span>';
                            
                            // تحديث كائن المريض بحالة الدفع الفعلية
                            p.is_paid = isPaid;

                            waitingContainer.innerHTML += `
                                <div class="patient-card-item" onclick='selectPatient(${JSON.stringify(p)})'>
                                    <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:0.85rem;">
                                        <span>${name}</span>
                                        ${paymentBadge}
                                    </div>
                                    <small style="color:#555;">الهاتف: ${p.phone || 'غير متوفر'}</small>
                                </div>
                            `;
                        }
                    });

                    if (count === 0) {
                        waitingContainer.innerHTML = '<div style="font-size:0.85rem; color:#7f8c8d; text-align:center; padding:15px;">لا توجد حالات بانتظار الكشف حالياً.</div>';
                    }
                });
            });
        }

        function selectPatient(patient) {
            selectedPatient = patient;
            document.getElementById('noPatientSelected').style.display = 'none';
            document.getElementById('consultationForm').style.display = 'block';
            
            document.getElementById('selectedPatientName').textContent = patient.patient_name || patient.name || '-';
            document.getElementById('selectedPatientPhone').textContent = `الهاتف: ${patient.phone || 'غير متوفر'}`;
            
            const isPaid = patient.is_paid || patient.payment_status === 'paid';
            document.getElementById('selectedPaymentBadge').innerHTML = isPaid ? '<span class="badge-paid">مدفوع ✔</span>' : '<span class="badge-unpaid">غير دافع ❌ (ينتظر الدفع عند المحاسب)</span>';
            
            document.getElementById('doctorDiagnosis').value = patient.diagnosis || '';
            document.getElementById('doctorPrescription').value = patient.prescription || '';
        }

        // جلب الأدوية من المخزون الحقيقي فقط
        async function loadRealInventoryMedicines() {
            try {
                const snapshot = await db.collection("sys_inventory").get();
                const select = document.getElementById('pharmacyItemSelect');
                select.innerHTML = '<option value="">-- اختر الدواء من المخزون الحقيقي --</option>';
                snapshot.forEach(doc => {
                    const item = doc.data();
                    if(item.name) {
                        select.innerHTML += `<option value="${item.name}">${item.name} (متوفر: ${item.quantity || 0})</option>`;
                    }
                });
            } catch(e) {}
        }

        function addMedicineToPrescription() {
            const select = document.getElementById('pharmacyItemSelect');
            const medName = select.value;
            if (!medName) return;
            const prescField = document.getElementById('doctorPrescription');
            prescField.value += (prescField.value ? '\n' : '') + `- دواء: ${medName}`;
            select.value = "";
        }

        // جلب فحوصات المختبر المسجلة حقيقياً فقط
        async function loadRealLabTests() {
            try {
                const snapshot = await db.collection("sys_lab_tests").get();
                const select = document.getElementById('labTestSelect');
                select.innerHTML = '<option value="">-- اختر فحص مختبر مسجل --</option>';
                snapshot.forEach(doc => {
                    const item = doc.data();
                    if(item.name) {
                        select.innerHTML += `<option value="${item.name}">${item.name} - ${item.price || 0} ₪</option>`;
                    }
                });
            } catch(e) {}
        }

        function addLabTestToPrescription() {
            const select = document.getElementById('labTestSelect');
            const testName = select.value;
            if (!testName) return;
            const prescField = document.getElementById('doctorPrescription');
            prescField.value += (prescField.value ? '\n' : '') + `[طلب فحص مختبر]: ${testName}`;
            select.value = "";
        }

        // جلب صور الأشعة المسجلة حقيقياً فقط
        async function loadRealRadTests() {
            try {
                const snapshot = await db.collection("sys_rad_tests").get();
                const select = document.getElementById('radTestSelect');
                select.innerHTML = '<option value="">-- اختر فحص أشعة مسجل --</option>';
                snapshot.forEach(doc => {
                    const item = doc.data();
                    if(item.name) {
                        select.innerHTML += `<option value="${item.name}">${item.name} - ${item.price || 0} ₪</option>`;
                    }
                });
            } catch(e) {}
        }

        function addRadTestToPrescription() {
            const select = document.getElementById('radTestSelect');
            const testName = select.value;
            if (!testName) return;
            const prescField = document.getElementById('doctorPrescription');
            prescField.value += (prescField.value ? '\n' : '') + `[طلب صورة أشعة]: ${testName}`;
            select.value = "";
        }

        // حفظ الكشف وإزالة المريض من قائمة الانتظار بعد إتمام الكشف
        document.getElementById('consultationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedPatient) return;

            const diagnosis = document.getElementById('doctorDiagnosis').value.trim();
            const prescription = document.getElementById('doctorPrescription').value.trim();

            try {
                await db.collection("appointments").doc(selectedPatient.id).set({
                    diagnosis: diagnosis,
                    prescription: prescription,
                    status: 'تم الكشف',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                alert('✔ تم حفظ الكشف الطبي بنجاح!');
                document.getElementById('consultationForm').reset();
                document.getElementById('noPatientSelected').style.display = 'block';
                document.getElementById('consultationForm').style.display = 'none';
                selectedPatient = null;
            } catch(err) {
                alert('حدث خطأ أثناء حفظ الكشف.');
            }
        });

        initDoctorPage();
    </script>
</body>
</html>
