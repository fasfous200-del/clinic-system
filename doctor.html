<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>عيادة الطبيب - النظام المعياري الطبي</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.appspot.com",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const db = firebase.firestore();

      const currentUserStr = localStorage.getItem('user');
      const currentUser = currentUserStr ? JSON.parse(currentUserStr) : null;
      if (!currentUser) {
          alert('يرجى تسجيل الدخول أولاً!');
          window.location.href = 'login.html';
      }
    </script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f5; margin: 0; padding: 15px; color: #333; }
        header { background: #2980b9; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        nav { text-align: center; margin-bottom: 20px; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        nav a { color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-weight: bold; margin: 0 4px; display: inline-block; font-size: 0.9rem; }
        .btn-home { background: #16a085; }
        .btn-billing { background: #e67e22; }
        .btn-doctor { background: #2980b9; }
        .btn-settings { background: #34495e; }

        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media(max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card h3 { margin-top: 0; padding-bottom: 8px; border-bottom: 2px solid #ecf0f1; color: #2980b9; }
        
        .patient-list { max-height: 450px; overflow-y: auto; }
        .patient-item { padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; background: #f8fafc; }
        .patient-item:hover { background: #edf2f7; border-color: #2980b9; }
        .patient-item.active { background: #ebf8ff; border-color: #3182ce; font-weight: bold; }

        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: Tahoma; }
        textarea { resize: vertical; height: 90px; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background: #219653; }

        .badge-unpaid { background: #fed7d7; color: #c53030; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .badge-paid { background: #c6f6d5; color: #22543d; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        
        .module-section { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 6px; margin-top: 12px; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>🩺 عيادة الطبيب والكشف السريري</h1>
        <p id="userInfo" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
    </header>

    <nav id="dynamicNav">
        <a href="dashboard.html" class="btn-home">🏠 الرئيسية</a>
        <a href="billing.html" class="btn-billing">💰 الفواتير</a>
        <a href="doctor.html" class="btn-doctor">🩺 الطبيب</a>
        <a href="settings.html" class="btn-settings">⚙️ الإعدادات</a>
    </nav>

    <div class="container">
        <!-- قائمة المرضى المنتظرين -->
        <div class="card">
            <h3>👥 قائمة انتظار المرضى (الحاضرون)</h3>
            <div class="patient-list" id="patientQueueList">
                <div style="text-align:center; color:#7f8c8d; padding:20px;">جاري تحميل المرضى...</div>
            </div>
        </div>

        <!-- تفاصيل الكشف والروشتة والأقسام المضافة -->
        <div class="card">
            <h3>📝 تفاصيل الكشف الطبي والروشتة</h3>
            <div id="noPatientSelected" style="text-align:center; color:#7f8c8d; padding:40px;">
                الرجاء اختيار مريض من القائمة البدء بالكشف.
            </div>

            <form id="consultationForm" style="display:none;">
                <div style="background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px;">
                    <strong>المريض: </strong><span id="selectedPatientName">-</span><br>
                    <strong>حالة الدفع عند المحاسب: </strong> <span id="selectedPaymentBadge">-</span>
                </div>

                <label>تشخيص الطبيب والملاحظات:</label>
                <textarea id="doctorDiagnosis" placeholder="أدخل تشخيص الحالة والملاحظات الطبية..."></textarea>

                <!-- قسم الروشتة الأساسية (للباقة الرئيسية أو كملخص) -->
                <label>الروشتة الطبية / التعليمات:</label>
                <textarea id="doctorPrescription" placeholder="اكتب الروشتة والأدوية هنا..."></textarea>

                <!-- قسم الصيدلية (يظهر حصرياً إذا كانت الصيدلية مفعلة) -->
                <div class="module-section" id="pharmacyModuleSection">
                    <label style="color:#2980b9;">💊 صرف الأدوية من المخزون:</label>
                    <select id="pharmacyItemSelect">
                        <option value="">-- اختر الدواء من المخزون --</option>
                    </select>
                    <button type="button" onclick="addMedicineToPrescription()" style="background:#2980b9; margin-top:5px; padding:6px;">إضافة للروشتة</button>
                </div>

                <!-- قسم المختبر (يظهر حصرياً إذا كان المختبر مفعل) -->
                <div class="module-section" id="labModuleSection">
                    <label style="color:#8e44ad;">🧪 طلب فحوصات مخبرية:</label>
                    <select id="labTestSelect">
                        <option value="">-- اختر فحص مختبر --</option>
                    </select>
                </div>

                <!-- قسم الأشعة (يظهر حصرياً إذا كانت الأشعة مفعلة) -->
                <div class="module-section" id="radModuleSection">
                    <label style="color:#d35400;">🩻 طلب فحوصات أشعة:</label>
                    <select id="radTestSelect">
                        <option value="">-- اختر فحص أشعة --</option>
                    </select>
                </div>

                <button type="submit">حفظ وإرسال الكشف الطبي للمحاسبة ✔</button>
            </form>
        </div>
    </div>

    <script>
        let selectedPatient = null;
        let activeModules = {};

        async function initDoctorPage() {
            if (currentUser) {
                document.getElementById('userInfo').textContent = `الطبيب / المستخدم: ${currentUser.full_name || currentUser.username}`;
            }

            // فحص صلاحيات الأقسام المفعلة للعيادة في السحاب
            try {
                const userDoc = await db.collection("sys_users").doc(currentUser.username).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    activeModules = userData.modules || {};

                    // تفعيل عرض الأقسام بناءً على الاشتراك المعياري
                    if (activeModules.pharmacy && activeModules.pharmacy.active) {
                        document.getElementById('pharmacyModuleSection').style.display = 'block';
                        loadInventoryMedicines();
                    }
                    if (activeModules.lab && activeModules.lab.active) {
                        document.getElementById('labModuleSection').style.display = 'block';
                        loadLabTestsDropdown();
                    }
                    if (activeModules.radiology && activeModules.radiology.active) {
                        document.getElementById('radModuleSection').style.display = 'block';
                        loadRadTestsDropdown();
                    }
                }
            } catch (err) {
                console.error("Error loading modules:", err);
            }

            loadPatientQueue();
        }

        // جلب المرضى الحاضرين (حالة حضور = مثبتة)
        function loadPatientQueue() {
            db.collection("appointments")
              .where("status", "in", ["حاضر", "checked_in", "انتظار"])
              .onSnapshot(snapshot => {
                const listContainer = document.getElementById('patientQueueList');
                listContainer.innerHTML = snapshot.empty ? '<div style="text-align:center; color:#7f8c8d; padding:20px;">لا توجد حالات في الانتظار حالياً.</div>' : '';
                
                snapshot.forEach(doc => {
                    const p = { id: doc.id, ...doc.data() };
                    const isPaid = p.payment_status === 'paid';
                    const paymentBadge = isPaid ? '<span class="badge-paid">مدفوع ✔</span>' : '<span class="badge-unpaid">غير دافع ❌</span>';
                    
                    listContainer.innerHTML += `
                        <div class="patient-item" onclick='selectPatient(${JSON.stringify(p)})'>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong>${p.patient_name || p.name || 'مريض بدون اسم'}</strong>
                                ${paymentBadge}
                            </div>
                            <small style="color:#666;">الهاتف: ${p.phone || 'غير متوفر'} | الرسوم: ${p.fee || 50} ₪</small>
                        </div>
                    `;
                });
            });
        }

        function selectPatient(patient) {
            selectedPatient = patient;
            document.getElementById('noPatientSelected').style.display = 'none';
            document.getElementById('consultationForm').style.display = 'block';
            
            document.getElementById('selectedPatientName').textContent = patient.patient_name || patient.name || '-';
            
            const isPaid = patient.payment_status === 'paid';
            document.getElementById('selectedPaymentBadge').innerHTML = isPaid ? '<span class="badge-paid">مدفوع ✔</span>' : '<span class="badge-unpaid">غير دافع ❌ (يجب عليه الدفع عند المحاسب)</span>';
            
            document.getElementById('doctorDiagnosis').value = patient.diagnosis || '';
            document.getElementById('doctorPrescription').value = patient.prescription || '';
        }

        // جلب الأدوية من المخزون للصيدلية
        async function loadInventoryMedicines() {
            try {
                const snapshot = await db.collection("sys_inventory").get();
                const select = document.getElementById('pharmacyItemSelect');
                snapshot.forEach(doc => {
                    const item = doc.data();
                    select.innerHTML += `<option value="${item.name}">${item.name} (الكمية: ${item.quantity || 0})</option>`;
                });
            } catch(e) { console.error("Error loading inventory:", e); }
        }

        function addMedicineToPrescription() {
            const select = document.getElementById('pharmacyItemSelect');
            const medName = select.value;
            if (!medName) return;
            const prescField = document.getElementById('doctorPrescription');
            prescField.value += (prescField.value ? '\n' : '') + `- دواء من المخزون: ${medName}`;
        }

        // جلب فحوصات المختبر
        async function loadLabTestsDropdown() {
            try {
                const snapshot = await db.collection("sys_lab_tests").get();
                const select = document.getElementById('labTestSelect');
                snapshot.forEach(doc => {
                    const item = doc.data();
                    select.innerHTML += `<option value="${item.name}">${item.name} - ${item.price} ₪</option>`;
                });
            } catch(e) {}
        }

        // جلب فحوصات الأشعة
        async function loadRadTestsDropdown() {
            try {
                const snapshot = await db.collection("sys_rad_tests").get();
                const select = document.getElementById('radTestSelect');
                snapshot.forEach(doc => {
                    const item = doc.data();
                    select.innerHTML += `<option value="${item.name}">${item.name} - ${item.price} ₪</option>`;
                });
            } catch(e) {}
        }

        // حفظ الكشف الطبي
        document.getElementById('consultationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedPatient) return;

            const diagnosis = document.getElementById('doctorDiagnosis').value.trim();
            const prescription = document.getElementById('doctorPrescription').value.trim();

            try {
                await db.collection("appointments").doc(selectedPatient.id).set({
                    diagnosis: diagnosis,
                    prescription: prescription,
                    status: 'تم الكشف',
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                alert('تم حفظ الكشف الطبي وإرسال الروشتة بنجاح!');
                document.getElementById('consultationForm').reset();
                document.getElementById('noPatientSelected').style.display = 'block';
                document.getElementById('consultationForm').style.display = 'none';
                selectedPatient = null;
            } catch(err) {
                alert('حدث خطأ أثناء حفظ الكشف.');
            }
        });

        initDoctorPage();
    </script>
</body>
</html>
