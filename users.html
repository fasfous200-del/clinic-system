<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة فريق العمل والمستخدمين</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.appspot.com",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
      const db = firebase.firestore();

      // التحقق من أن المستخدم الحالي مسجل دخول وله صلاحية
      const currentUserStr = localStorage.getItem('user');
      const currentClinicId = localStorage.getItem('current_clinic_id');
      if (!currentUserStr || !currentClinicId) {
          alert('الرجاء تسجيل الدخول أولاً!');
          window.location.href = 'login.html';
      }
    </script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; }
        header { background: #34495e; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; margin-top: 10px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #219653; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { text-align: right; padding: 10px; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; color: #2c3e50; }
        .btn-delete { background: #c0392b; padding: 5px 10px; width: auto; font-size: 0.8rem; }
        .back-link { display: inline-block; margin-bottom: 15px; text-decoration: none; background: #2980b9; color: white; padding: 6px 12px; border-radius: 4px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <a href="dashboard.html" class="back-link">⬅ العودة لوحة التحكم</a>
        <header>
            <h1>إدارة موظفي وعاملين العيادة</h1>
            <p id="clinicInfo" style="margin: 5px 0 0 0; font-size: 0.9rem;"></p>
        </header>

        <!-- نموذج إضافة موظف جديد -->
        <div class="card">
            <h3>➕ إضافة موظف جديد لعيادتك</h3>
            <form id="addUserForm">
                <label>الاسم الكامل للموظف:</label>
                <input type="text" id="full_name" required placeholder="مثال: أحمد محمد (موظف استقبال)...">

                <label>اسم المستخدم للدخول:</label>
                <input type="text" id="username" required placeholder="مثال: reception1...">

                <label>كلمة المرور:</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور...">

                <label>الصلاحية / الوظيفة:</label>
                <select id="role" required>
                    <option value="receptionist">موظف استقبال</option>
                    <option value="accountant">محاسب</option>
                    <option value="nurse">ممرض / ممرضة</option>
                    <option value="admin">مدير عيادة / مساعد طبيب</option>
                </select>

                <button type="submit" style="margin-top: 10px;">حفظ وإضافة الموظف</button>
            </form>
        </div>

        <!-- جدول عرض موظفي العيادة الحاليين -->
        <div class="card">
            <h3>👥 طاقم العمل المسجل في عيادتك</h3>
            <table>
                <thead>
                    <tr>
                        <th>الاسم الكامل</th>
                        <th>اسم المستخدم</th>
                        <th>الصلاحية</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" style="text-align:center;">جاري تحميل الموظفين...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const clinicId = localStorage.getItem('current_clinic_id');
        const currentUser = JSON.parse(localStorage.getItem('user'));
        document.getElementById('clinicInfo').textContent = `معرف العيادة: ${clinicId} | المدير الحالي: ${currentUser.full_name}`;

        // جلب وعرض مستخدمي هذه العيادة فقط
        function loadClinicUsers() {
            db.collection("sys_users").where("clinic_id", "==", clinicId).onSnapshot((snapshot) => {
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = snapshot.empty ? '<tr><td colspan="4" style="text-align:center; color:#7f8c8d;">لا يوجد موظفون مضافون حتى الآن.</td></tr>' : '';
                
                snapshot.forEach(doc => {
                    const u = doc.data();
                    let roleName = u.role;
                    if(u.role === 'receptionist') roleName = 'موظف استقبال';
                    if(u.role === 'accountant') roleName = 'محاسب';
                    if(u.role === 'nurse') roleName = 'ممرض';
                    if(u.role === 'admin') roleName = 'مدير عيادة';

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${u.full_name}</strong></td>
                            <td>${u.username}</td>
                            <td><span style="background:#e0f2fe; color:#0369a1; padding:3px 8px; border-radius:4px; font-size:0.8rem;">${roleName}</span></td>
                            <td><button class="btn-delete" onclick="deleteUser('${doc.id}')">حذف</button></td>
                        </tr>`;
                });
            });
        }

        // إضافة موظف جديد مع جعل Document ID = username واستخدام .create() لمنع التكرار نهائياً
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('full_name').value.trim();
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('role').value;

            try {
                // استخدام اسم المستخدم مباشرة كمعرف للمستند Document ID
                await db.collection("sys_users").doc(username).create({
                    id: username,
                    full_name: fullName,
                    username: username,
                    password: password,
                    role: role,
                    clinic_id: clinicId, // **الربط الحاسم بالعيادة**
                    created_at: new Date().toISOString()
                });

                alert('✔ تم إضافة الموظف بنجاح بمعرف فريد في فايرستور!');
                document.getElementById('addUserForm').reset();
            } catch(err) {
                console.error("Add user error:", err);
                // إذا حاول المستخدم إدخال اسم موجود مسبقاً، سيرفض فايرستور العملية ويعطي خطأ already-exists
                if (err.code === 'already-exists' || (err.message && err.message.includes('already exists'))) {
                    alert('❌ خطأ: اسم المستخدم هذا موجود مسبقاً في النظام ولا يمكن تكراره نهائياً!');
                } else {
                    alert('حدث خطأ أثناء إضافة الموظف.');
                }
            }
        });

        // حذف موظف
        async function deleteUser(docId) {
            if (confirm('هل أنت متأكد من حذف هذا الموظف؟')) {
                try {
                    await db.collection("sys_users").doc(docId).delete();
                    alert('تم الحذف بنجاح.');
                } catch(err) {
                    alert('تعذر حذف المستخدم.');
                }
            }
        }

        loadClinicUsers();
    </script>
</body>
</html>
