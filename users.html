<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين والصلاحيات - المركز الطبي</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyB5NwsQ_gb7kMT5fgyxtL6iG5gAfHpX0G4",
        authDomain: "clinic-system-15fc3.firebaseapp.com",
        projectId: "clinic-system-15fc3",
        storageBucket: "clinic-system-15fc3.firebasestorage.app",
        messagingSenderId: "224792664588",
        appId: "1:224792664588:web:22b9450c0d7ae68e3d2c29",
        measurementId: "G-1CR1SK02ET"
      };
      if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.firestore();
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { margin: 0; color: #2c3e50; }
        .btn-back { background: #7f8c8d; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; }
        .form-section { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #e9ecef; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: #495057; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ced4da; border-radius: 5px; font-size: 0.95rem; }
        .btn-submit { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; transition: background 0.2s; }
        .btn-submit:hover { background: #219150; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: right; padding: 12px; border-bottom: 1px solid #dee2e6; }
        th { background: #34495e; color: white; }
        tr:hover { background: #f1f2f6; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; }
        .badge-admin { background: #e74c3c; }
        .badge-doctor { background: #2980b9; }
        .badge-accountant { background: #e67e22; }
        .badge-lab { background: #7c3aed; }
        .badge-rad { background: #2563eb; }

        .btn-action-sm { padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; font-size: 0.8rem; color: white; margin-left: 5px; }
        .btn-pwd { background: #f39c12; }
        .btn-pwd:hover { background: #d68910; }
        .btn-del { background: #c0392b; }
        .btn-del:hover { background: #a93226; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>👤 إدارة المستخدمين وتغيير كلمة السر</h2>
        <a href="dashboard.html" class="btn-back">⬅️ العودة للوحة التحكم</a>
    </header>

    <!-- نموذج إضافة مستخدم جديد -->
    <div class="form-section">
        <h3>إضافة مستخدم جديد</h3>
        <form id="addUserForm" onsubmit="saveUser(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المستخدم (لاتيني بدون مساحات):</label>
                    <input type="text" id="username" required placeholder="مثال: doctor1">
                </div>
                <div class="form-group">
                    <label>الاسم الكامل:</label>
                    <input type="text" id="full_name" required placeholder="مثال: د. أحمد محمود">
                </div>
                <div class="form-group">
                    <label>كلمة المرور:</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <div class="form-group">
                    <label>الدور / الصلاحية:</label>
                    <select id="role" required>
                        <option value="doctor">طبيب (عيادة)</option>
                        <option value="accountant">محاسب (الصندوق والمشتريات)</option>
                        <option value="lab_tech">فني مختبر</option>
                        <option value="rad_tech">فني أشعة</option>
                        <option value="admin">مدير النظام (صلاحية كاملة)</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-submit">➕ إضافة المستخدم</button>
        </form>
    </div>

    <!-- جدول قائمة المستخدمين -->
    <h3>قائمة الحسابات المسجلة</h3>
    <table>
        <thead>
            <tr>
                <th>اسم المستخدم</th>
                <th>الاسم الكامل</th>
                <th>الدور / الصلاحية</th>
                <th>الإجراءات (التحكم)</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <tr>
                <td colspan="4" style="text-align: center;">جاري تحميل الحسابات...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    // حماية الصفحة: التأكد من أن المستخدم مدير نظام فقط
    function checkAdminAccess() {
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            window.location.href = 'login.html';
            return;
        }
        const user = JSON.parse(userStr);
        if (user.role !== 'admin') {
            alert('عذراً، هذه الصفحة مخصصة لمدير النظام فقط!');
            window.location.href = 'dashboard.html';
        }
    }

    // جلب وحمل قائمة المستخدمين من Firebase
    function loadUsers() {
        db.collection("sys_users").onSnapshot((querySnapshot) => {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (querySnapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;">لا يوجد مستخدمين مسجلين.</td></tr>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const u = doc.data();
                const docId = doc.id;
                
                let badgeClass = 'badge-doctor';
                let roleLabel = 'طبيب';

                if (u.role === 'admin') { badgeClass = 'badge-admin'; roleLabel = 'مدير النظام'; }
                else if (u.role === 'accountant') { badgeClass = 'badge-accountant'; roleLabel = 'محاسب'; }
                else if (u.role === 'lab_tech') { badgeClass = 'badge-lab'; roleLabel = 'فني مختبر'; }
                else if (u.role === 'rad_tech') { badgeClass = 'badge-rad'; roleLabel = 'فني أشعة'; }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${u.username || docId}</strong></td>
                    <td>${u.full_name || '-'}</td>
                    <td><span class="badge ${badgeClass}">${roleLabel}</span></td>
                    <td>
                        <button onclick="changePassword('${docId}', '${u.full_name}')" class="btn-action-sm btn-pwd">🔑 تغيير كلمة السر</button>
                        ${docId !== 'admin' ? `<button onclick="deleteUser('${docId}')" class="btn-action-sm btn-del">🗑️ حذف</button>` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        });
    }

    // إضافة مستخدم جديد
    async function saveUser(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim().toLowerCase();
        const full_name = document.getElementById('full_name').value.trim();
        const password = document.getElementById('password').value.trim();
        const role = document.getElementById('role').value;

        try {
            await db.collection("sys_users").doc(username).set({
                username: username,
                full_name: full_name,
                password: password,
                role: role,
                created_at: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('تم إضافة المستخدم بنجاح!');
            document.getElementById('addUserForm').reset();
        } catch (error) {
            alert('حدث خطأ أثناء حفظ المستخدم: ' + error.message);
        }
    }

    // تغيير كلمة السر لأي مستخدم بواسطة المدير
    async function changePassword(username, fullName) {
        const newPassword = prompt(`أدخل كلمة السر الجديدة للمستخدم (${fullName} - ${username}):`);
        
        if (newPassword === null) return; // تم الإلغاء
        if (newPassword.trim() === '') {
            alert('لا يمكن أن تكون كلمة السر فارغة!');
            return;
        }

        try {
            await db.collection("sys_users").doc(username).update({
                password: newPassword.trim()
            });
            alert(`تم تغيير كلمة السر بنجاح للمستخدم: ${fullName}`);
        } catch (error) {
            alert('حدث خطأ أثناء تغيير كلمة السر: ' + error.message);
        }
    }

    // حذف مستخدم
    async function deleteUser(username) {
        if (confirm(`هل أنت تأكد من حذف الحساب (${username})؟`)) {
            try {
                await db.collection("sys_users").doc(username).delete();
                alert('تم حذف الحساب بنجاح.');
            } catch (error) {
                alert('حدث خطأ أثناء الحذف: ' + error.message);
            }
        }
    }

    window.onload = () => {
        checkAdminAccess();
        loadUsers();
    };
</script>

</body>
</html>
